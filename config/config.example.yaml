# ==============================================================
# 厦大体育馆自动预约 - 极简配置文件
# 小白提示：绝大部分参数无需修改，开箱即用！
# ==============================================================

# 1. 登录凭证（二选一）：
# 【推荐】不用手动填写！启动网页版或运行微信自动登录后，系统会自动截取并填入。
# 【备用】若手动抓包拿到了 PHPSESSID，可直接粘贴在引号内：
auth:
  phpsessid: ""

# 2. 预约时段设置
target:
  # 预约目标时段（直接改成你想约的时间即可，例如 18:00-19:30、19:30-21:00）
  preferred_time: "19:30-21:00"

  # 预约哪一天的场地：
  # 1 = 预约明天（早 7 点抢次日名额，默认）
  # 0 = 预约今天
  target_date_offset: 1

  # 校区场馆选择（默认：翔安校区健身房）
  # 若想预约【思明校区健身房】，只需将下方 2 行开头的 # 去掉即可：
  # stadium_id: 6
  # venue_id: 6

# 3. 定时抢票设置 (默认早上 07:00:00，测试或自定义时可修改)
scheduler:
  target_time: "07:00:00"  # 每日开放抢票时刻 (24小时制，例如 07:00:00)

# 4. 微信推送提醒（可选）
# 抢票成功后微信自动发卡片通知提醒你。如不需要可直接留空。
# 获取方法：微信扫码登录 https://www.pushplus.plus/ 复制 Token 填入下方：
notify:
  pushplus_token: ""

# --------------------------------------------------------------
# 💡 进阶提示：如需配置邮件 SMTP、Server酱、秒级抢票重试间隔等高级参数，
# 请参考完整模板文件：config/config.advanced.example.yaml
# --------------------------------------------------------------
